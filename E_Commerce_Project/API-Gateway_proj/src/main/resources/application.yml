spring:
    application:
        name: api-gateway

    cloud:
        gateway:
            routes:
                - id: order-service
                  uri: lb://order-service
                  predicates:
                      - Path=/orders/**
                  filters:
                      - StripPrefix=1

                - id: inventory-service
                  uri: lb://inventory-service
                  predicates:
                      - Path=/inventory/**
                  filters:
                      - StripPrefix=1

                - id: checkout-service
                  uri: lb://checkout-service
                  predicates:
                      - Path=/checkout/**
                  filters:
                      - StripPrefix=1

server:
    port: 9090

eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka
        register-with-eureka: true
        fetch-registry: true
