spring:
    application:
        name: API_GATEWAY

    cloud:
        gateway:
            routes:
                - id: inventory-service
                  uri: lb://INVENTORY-SERVICE
                  predicates:
                      - Path=/inventory/**
                  filters:
                      - StripPrefix=1

                - id: order-service
                  uri: lb://ORDER_SERVICE
                  predicates:
                      - Path=/orders/**
                  filters:
                      - StripPrefix=1

                - id: checkout-service
                  uri: lb://CHECKOUT_SERVICE
                  predicates:
                      - Path=/checkout/**
                  filters:
                      - StripPrefix=1

eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka
        register-with-eureka: true
        fetch-registry: true

server:
    port: 9090

management:
    endpoints:
        web:
            exposure:
                include: "*"

logging:
    level:
        org.springframework.cloud.gateway: DEBUG
        org.springframework.cloud.loadbalancer: DEBUG
