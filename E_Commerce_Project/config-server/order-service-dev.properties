spring.application.name=order-service

server.port=8018

spring.datasource.url=jdbc:mysql://localhost:3306/microservice_ecom_03aug26
spring.datasource.username=root
spring.datasource.password=TIGER

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

resilience4j.circuitbreaker.instances.checkoutService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.checkoutService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.checkoutService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.checkoutService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.checkoutService.waitDurationInOpenState=20s
resilience4j.circuitbreaker.instances.checkoutService.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.checkoutService.automaticTransitionFromOpenToHalfOpenEnabled=true

# Logging
logging.level.io.github.resilience4j=DEBUG
