server:
  port: 8081

spring:

  # =========================
  # MySQL
  # =========================
  datasource:
    url: jdbc:mysql://localhost:3306/product_db
    username: root
    password: TIGER

  # =========================
  # JPA / Hibernate
  # =========================
  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  # =========================
  # MongoDB
  # =========================
  data:
    mongodb:
      uri: mongodb://localhost:27017/product_db


# =========================
# Eureka
# =========================
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true


# =========================
# Actuator
# =========================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always


# =========================
# Logging
# =========================
logging:
  level:
    com.products: INFO
    org.springframework.data.mongodb: INFO
    org.hibernate.SQL: DEBUG